<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 390" class="illustration" role="img" aria-label="Illustrated wallet displaying growing balances and coin icons"><style>.stroke{stroke:#482d50;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#704b8d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bob{transform-origin:center;animation:float 4s ease-in-out infinite}.bob2{transform-origin:center;animation:float 4.7s ease-in-out infinite -2s}.pulse{transform-origin:center;animation:pop 3s ease-in-out infinite}.swing{transform-box:fill-box;transform-origin:center;animation:swing 3.7s ease-in-out infinite}.spark{transform-origin:center;animation:twinkle 3s ease-in-out infinite}.spark2{transform-origin:center;animation:twinkle 2.5s ease-in-out infinite -1s}.flowline{stroke-dasharray:13 14;animation:dash 3s linear infinite}.flowup{animation:flowUp 4.5s ease-in-out infinite}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3.5s ease-in-out infinite}.pop{transform-box:fill-box;transform-origin:center;animation:pop 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes slideRight{0%,100%{transform:translateX(-16px)}50%{transform:translateX(37px)}}@keyframes slideLeft{0%,100%{transform:translateX(16px)}50%{transform:translateX(-37px)}}@keyframes twinkle{0%,100%{opacity:.5;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}@keyframes dash{to{stroke-dashoffset:-108}}@keyframes flowUp{0%,100%{transform:translateY(10px);opacity:.4}50%{transform:translateY(-13px);opacity:1}}@keyframes grow{0%,100%{transform:scaleY(.65)}50%{transform:scaleY(1)}}@keyframes arrowPulse{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(9px);opacity:.75}}@keyframes arrowUp{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-9px);opacity:.75}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="bob2"><rect x="67" y="106" width="332" height="224" rx="45" fill="#d9c2f4" class="stroke"/><rect x="70" y="128" width="326" height="201" rx="37" fill="#fff" stroke="#553e6a" stroke-width="7"/><rect x="96" y="158" width="194" height="28" rx="13" fill="#efdefb"/><rect x="96" y="202" width="170" height="15" rx="7" fill="#ece4f3"/><rect x="96" y="229" width="139" height="15" rx="7" fill="#ece4f3"/><rect x="287" y="186" width="124" height="80" rx="23" fill="#9ad9c1" class="stroke"/><circle cx="346" cy="226" r="17" fill="#fff"/><g class="grow"><rect x="107" y="289" width="31" height="28" rx="7" fill="#ef9cc9"/><rect x="151" y="270" width="31" height="47" rx="7" fill="#c8a9e7"/><rect x="195" y="250" width="31" height="67" rx="7" fill="#9bd7bf"/><rect x="239" y="277" width="31" height="40" rx="7" fill="#e8b0d9"/></g></g><g class="bob"><circle cx="121" cy="115" r="46" fill="#ffdaec" class="stroke"/><text x="121" y="132" text-anchor="middle" font-size="46" fill="#d77aa5">$</text></g><g class="bob2"><circle cx="330" cy="86" r="43" fill="#ddf5e6" class="stroke"/><text x="330" y="102" text-anchor="middle" font-size="42" fill="#55a28b">Ξ</text></g></svg>