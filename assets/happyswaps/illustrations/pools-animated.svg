<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 390" class="illustration" role="img" aria-label="Pastel mint pool filling with liquidity tokens and bubbles"><style>.stroke{stroke:#482d50;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#704b8d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bob{transform-origin:center;animation:float 4s ease-in-out infinite}.bob2{transform-origin:center;animation:float 4.7s ease-in-out infinite -2s}.pulse{transform-origin:center;animation:pop 3s ease-in-out infinite}.swing{transform-box:fill-box;transform-origin:center;animation:swing 3.7s ease-in-out infinite}.spark{transform-origin:center;animation:twinkle 3s ease-in-out infinite}.spark2{transform-origin:center;animation:twinkle 2.5s ease-in-out infinite -1s}.flowline{stroke-dasharray:13 14;animation:dash 3s linear infinite}.flowup{animation:flowUp 4.5s ease-in-out infinite}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3.5s ease-in-out infinite}.pop{transform-box:fill-box;transform-origin:center;animation:pop 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes slideRight{0%,100%{transform:translateX(-16px)}50%{transform:translateX(37px)}}@keyframes slideLeft{0%,100%{transform:translateX(16px)}50%{transform:translateX(-37px)}}@keyframes twinkle{0%,100%{opacity:.5;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}@keyframes dash{to{stroke-dashoffset:-108}}@keyframes flowUp{0%,100%{transform:translateY(10px);opacity:.4}50%{transform:translateY(-13px);opacity:1}}@keyframes grow{0%,100%{transform:scaleY(.65)}50%{transform:scaleY(1)}}@keyframes arrowPulse{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(9px);opacity:.75}}@keyframes arrowUp{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-9px);opacity:.75}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="poolClip"><rect x="70" y="123" width="320" height="210" rx="75"/></clipPath><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9f2e1"/><stop offset="1" stop-color="#79c7b7"/></linearGradient></defs><rect x="70" y="123" width="320" height="210" rx="75" fill="#fff" class="stroke"/><g clip-path="url(#poolClip)"><path class="flowup" d="M60 219 Q103 191 147 219 T233 219 T319 219 T405 219 L405 349 L60 349Z" fill="url(#water)"/><path d="M45 255 Q100 229 153 255 T263 255 T395 255" fill="none" stroke="#fff" stroke-width="9" opacity=".7"/></g><g class="bob"><circle cx="152" cy="174" r="46" fill="#f5e8ff" class="stroke"/><image data-token="ethereum" x="124.0" y="146.0" width="56" height="56" href="data:image/svg+xml;base64,"/></g><g class="bob2"><circle cx="299" cy="157" r="43" fill="#ffe4e9" class="stroke"/><image data-token="usdc" x="271.0" y="129.0" width="56" height="56" href="data:image/svg+xml;base64,"/></g><g fill="#fff" stroke="#81cdbb" stroke-width="4"><circle cx="113" cy="223" r="13" class="flowup"/><circle cx="227" cy="180" r="12" class="flowup"/><circle cx="342" cy="220" r="16" class="flowup"/></g><path d="M92 332Q231 355 368 332" fill="none" stroke="#4c9f8c" stroke-width="11" stroke-linecap="round"/></svg>